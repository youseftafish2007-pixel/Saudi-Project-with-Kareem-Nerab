<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Kaaba</title>
<style>
:root{--bg:#f4f1ea;--surface:#fff;--text:#1d2433;--muted:#6b7280;--accent:#1f7a5c;--line:rgba(0,0,0,.1);--shadow:0 6px 20px rgba(0,0,0,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#1a2133;--text:#eef1f7;--muted:#9aa4b8;--accent:#3ec59a;--line:rgba(255,255,255,.12);--shadow:0 6px 20px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#1a2133;--text:#eef1f7;--muted:#9aa4b8;--accent:#3ec59a;--line:rgba(255,255,255,.12);--shadow:0 6px 20px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.ttl b{font-size:18px;letter-spacing:-.01em;display:block}
.ttl span,.pct span{color:var(--muted);font-size:12px}
.pct{text-align:right}
.pct b{font-size:26px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.pct em{color:#e5484d;font-style:normal}
#bar{height:6px;margin:0 16px 10px;border-radius:6px;background:var(--line);overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px}
.tools button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--text);font-size:18px;box-shadow:var(--shadow);cursor:pointer}
.tools button.on{background:var(--accent);color:#fff}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#hint.off{opacity:0}
#pal{display:flex;gap:10px;overflow-x:auto;padding:14px 14px 12px;scrollbar-width:none}
#pal::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:48px;border:0;background:none;padding:0;color:var(--muted);font-size:11px;cursor:pointer;text-align:center}
.chip{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;font-weight:700;font-size:18px;border:2px solid var(--line);transition:transform .12s}
.sw.sel .chip{transform:translateY(-4px) scale(1.06);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.sw small{display:block;margin-top:5px}
.sw.fin{opacity:.5}
#done{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,14,25,.7);z-index:5;padding:20px}
#done.show{display:grid}
.card{background:var(--surface);border-radius:24px;padding:24px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow);animation:pop .4s}
.card h2{margin:6px 0 2px;font-size:22px}
.card p{margin:0;color:var(--muted)}
#thumb{display:block;width:160px;height:180px;image-rendering:pixelated;border-radius:10px;margin:14px auto 18px;box-shadow:var(--shadow)}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:600;font-size:15px;cursor:pointer}
.p{background:var(--accent);color:#fff}
.g{background:var(--line);color:var(--text)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.conf{position:fixed;top:-14px;width:8px;height:12px;animation:fall linear forwards;z-index:6;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><b>Pixel Kaaba</b><span>Level 1 · Night at the Haram</span></div>
    <div class="pct"><b id="pct">0%</b><span id="cnt"></span></div>
  </header>
  <div id="bar"><i id="fill"></i></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="tools">
      <button id="bPan" title="Pan mode (one finger)">✋</button>
      <button id="bFit" title="Fit to screen">⤢</button>
      <button id="bReset" title="Restart">↺</button>
    </div>
    <div id="hint">Tap or drag to color · pinch to zoom · two fingers to pan</div>
  </div>
  <div id="pal"></div>
</div>
<div id="done">
  <div class="card">
    <div style="font-size:40px">🎉</div>
    <h2>Level complete!</h2>
    <p>Every pixel colored — 100%</p>
    <canvas id="thumb" width="160" height="180"></canvas>
    <div class="btns"><button class="g" id="bView">View artwork</button><button class="p" id="bAgain">Play again</button></div>
  </div>
</div>
<script>
(()=>{
const $=q=>document.querySelector(q);
const W=32,H=36,N=W*H,KEY='pixel-kaaba-v1';
const COL=[null,'#16213e','#2f5d8a','#ffe17a','#17171c','#c98a1b','#fbf9f3','#8f929c','#cfb88f','#3b3b44'];
const PAPER='#e4e6ea',HL='#fff2b8',NUM='#6b7280',RED='#e5484d';

/* ---------- build the target picture ---------- */
const T=new Uint8Array(N);
(function(){
  const set=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)T[y*W+x]=c};
  const rect=(a,b,c,d,k)=>{for(let y=b;y<=d;y++)for(let x=a;x<=c;x++)set(x,y,k)};
  rect(0,0,W-1,9,1);rect(0,10,W-1,25,2);
  [[8,3],[14,6],[11,1],[17,2],[30,1],[7,7],[1,3],[15,9]].forEach(([x,y])=>set(x,y,3));
  for(let y=1;y<=9;y++)for(let x=18;x<=27;x++){
    if(Math.hypot(x-22,y-5)<=3.1)set(x,y,3);
    if(Math.hypot(x-23.3,y-4.2)<=2.7)set(x,y,1);
  }
  [3,28].forEach(c=>{
    rect(c-1,9,c+1,25,8);set(c,5,3);set(c,6,5);rect(c-1,7,c+1,7,5);rect(c-2,8,c+2,8,7);
    [12,16,20].forEach(y=>set(c,y,7));
  });
  rect(9,12,20,24,4);rect(21,13,24,24,9);rect(10,11,24,11,7);rect(21,12,24,12,7);rect(8,25,25,25,8);
  rect(9,15,20,16,5);rect(21,16,24,17,5);
  for(let x=10;x<=20;x+=2)set(x,18,5);
  rect(14,18,16,23,5);rect(15,19,15,22,4);
  for(let y=26;y<H;y++)for(let x=0;x<W;x++){
    const v=((x-16.5)/15)**2+((y-25)/10)**2;set(x,y,v<=.3?8:v<=.95?6:7);
  }
  for(let i=0;i<=13;i++){
    const t=Math.PI*(.08+.84*i/13),x=Math.round(16.5+12*Math.cos(t)),y=Math.round(25+7.5*Math.sin(t));
    if(T[y*W+x]===6)set(x,y,1);
  }
})();

/* ---------- state ---------- */
let P=new Uint8Array(N),sel=1,correct=0,wrong=0,remain=new Array(10).fill(0),shown=false,ch=false;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.p&&s.p.length===N){for(let i=0;i<N;i++)P[i]=+s.p[i]||0;sel=s.sel||1}}catch(e){}
function recount(){correct=wrong=0;remain.fill(0);for(let i=0;i<N;i++){if(P[i]===T[i])correct++;else{remain[T[i]]++;if(P[i])wrong++}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({p:Array.from(P).join(''),sel}))}catch(e){}}
recount();

/* ---------- palette + HUD ---------- */
const pal=$('#pal');
const lum=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000};
COL.forEach((c,i)=>{if(!i)return;const b=document.createElement('button');b.className='sw';
  b.innerHTML=`<span class="chip" style="background:${c};color:${lum(c)>150?'#222':'#fff'}">${i}</span><small></small>`;
  b.onclick=()=>{sel=i;hud();draw();save()};pal.appendChild(b)});
function hud(){
  $('#pct').textContent=Math.floor(correct*100/N)+'%';
  $('#fill').style.width=(correct*100/N)+'%';
  $('#cnt').innerHTML=(wrong?`<em>${wrong} wrong</em> · `:'')+`${correct}/${N}`;
  [...pal.children].forEach((b,k)=>{const c=k+1;b.classList.toggle('sel',c===sel);b.classList.toggle('fin',!remain[c]);b.lastChild.textContent=remain[c]?remain[c]:'✓'});
  if(correct===N&&!shown){shown=true;setTimeout(showDone,500)}
}

/* ---------- canvas / view ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let vw=0,vh=0,dpr=1,s=10,ox=0,oy=0,minS=4,maxS=64,pan=false,first=true,dirty=false;
function fit(){s=Math.min(vw/W,vh/H)*.96;ox=(vw-W*s)/2;oy=(vh-H*s)/2;minS=s*.8}
function clamp(){const m=40;ox=Math.min(vw-m,Math.max(m-W*s,ox));oy=Math.min(vh-m,Math.max(m-H*s,oy))}
function zoomAt(px,py,ns){ns=Math.max(minS,Math.min(maxS,ns));const wx=(px-ox)/s,wy=(py-oy)/s;s=ns;ox=px-wx*s;oy=py-wy*s;clamp()}
new ResizeObserver(()=>{const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;vw=r.width;vh=r.height;cv.width=vw*dpr;cv.height=vh*dpr;if(first){fit();first=false}draw()}).observe(stage);
function draw(){if(!dirty){dirty=true;requestAnimationFrame(render)}}
function render(){
  dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);
  const done=correct===N;
  ctx.fillStyle=PAPER;ctx.fillRect(ox,oy,W*s,H*s);
  const x0=Math.max(0,Math.floor(-ox/s)),x1=Math.min(W-1,Math.floor((vw-ox)/s)),y0=Math.max(0,Math.floor(-oy/s)),y1=Math.min(H-1,Math.floor((vh-oy)/s));
  const showNum=s>=9;
  if(showNum){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${s*.5}px system-ui,sans-serif`}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*W+x,p=P[i],px=ox+x*s,py=oy+y*s;
    if(p){
      ctx.fillStyle=COL[p];ctx.fillRect(px,py,s+.5,s+.5);
      if(p!==T[i]){ctx.strokeStyle=RED;ctx.lineWidth=Math.max(1,s*.12);ctx.beginPath();
        ctx.moveTo(px+s*.25,py+s*.25);ctx.lineTo(px+s*.75,py+s*.75);ctx.moveTo(px+s*.75,py+s*.25);ctx.lineTo(px+s*.25,py+s*.75);ctx.stroke()}
    }else{
      if(T[i]===sel){ctx.fillStyle=HL;ctx.fillRect(px,py,s,s)}
      if(showNum){ctx.fillStyle=T[i]===sel?'#3a3326':NUM;ctx.fillText(T[i],px+s/2,py+s/2+.5)}
    }
  }
  if(!done&&s>=6){
    ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;ctx.beginPath();
    for(let x=x0;x<=x1+1;x++){ctx.moveTo(Math.round(ox+x*s)+.5,oy+y0*s);ctx.lineTo(Math.round(ox+x*s)+.5,oy+(y1+1)*s)}
    for(let y=y0;y<=y1+1;y++){ctx.moveTo(ox+x0*s,Math.round(oy+y*s)+.5);ctx.lineTo(ox+(x1+1)*s,Math.round(oy+y*s)+.5)}
    ctx.stroke();
  }
}

/* ---------- painting ---------- */
const cellAt=(cx,cy)=>{const x=Math.floor((cx-ox)/s),y=Math.floor((cy-oy)/s);return x>=0&&y>=0&&x<W&&y<H?y*W+x:-1};
function paint(i){
  if(i<0||P[i]===sel||P[i]===T[i])return;
  const o=P[i];
  if(o&&o!==T[i])wrong--;
  P[i]=sel;
  if(sel===T[i]){correct++;remain[T[i]]--}
  else{wrong++;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
  ch=true;
}
let lx=0,ly=0;
function strokeTo(x,y){
  const dx=x-lx,dy=y-ly,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(s*.4)));
  for(let k=1;k<=n;k++)paint(cellAt(lx+dx*k/n,ly+dy*k/n));
  lx=x;ly=y;
}
function flush(){if(ch){ch=false;hud();draw()}}

/* ---------- gestures ---------- */
const ptr=new Map();let mode=null,pinch=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function startPinch(){const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s,ox,oy}}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=pos(e);ptr.set(e.pointerId,p);$('#hint').classList.add('off');
  if(ptr.size===2){mode='pinch';startPinch()}
  else if(ptr.size===1){lx=p.x;ly=p.y;if(pan)mode='pan';else{mode='paint';paint(cellAt(p.x,p.y));flush()}}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const p=pos(e),prev=ptr.get(e.pointerId);ptr.set(e.pointerId,p);
  if(mode==='pinch'&&ptr.size>=2){
    const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=Math.max(minS,Math.min(maxS,pinch.s*d/pinch.d)),wx=(pinch.mx-pinch.ox)/pinch.s,wy=(pinch.my-pinch.oy)/pinch.s;
    s=ns;ox=mx-wx*s;oy=my-wy*s;clamp();draw();
  }else if(mode==='pan'){ox+=p.x-prev.x;oy+=p.y-prev.y;clamp();draw()}
  else if(mode==='paint'){strokeTo(p.x,p.y);flush()}
});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size===1&&mode==='pinch')mode='none';if(ptr.size===0){mode=null;save()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,s*Math.exp(-e.deltaY*.0015));draw()},{passive:false});
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'){sel=+e.key;hud();draw();save()}});

/* ---------- buttons ---------- */
$('#bPan').onclick=e=>{pan=!pan;e.currentTarget.classList.toggle('on',pan)};
$('#bFit').onclick=()=>{fit();draw()};
let armed=false;const bR=$('#bReset');
bR.onclick=()=>{
  if(!armed){armed=true;bR.textContent='?';bR.classList.add('on');setTimeout(()=>{armed=false;bR.textContent='↺';bR.classList.remove('on')},2000)}
  else{armed=false;bR.textContent='↺';bR.classList.remove('on');reset()}
};
function reset(){P.fill(0);shown=false;recount();save();$('#done').classList.remove('show');hud();draw()}

/* ---------- completion ---------- */
function showDone(){
  const t=$('#thumb').getContext('2d');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){t.fillStyle=COL[T[y*W+x]];t.fillRect(x*5,y*5,5,5)}
  $('#done').classList.add('show');
  for(let i=0;i<40;i++){const d=document.createElement('i');d.className='conf';
    d.style.cssText=`left:${Math.random()*100}%;background:${COL[1+Math.floor(Math.random()*9)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),4800)}
}
$('#bView').onclick=()=>$('#done').classList.remove('show');
$('#bAgain').onclick=reset;

hud();
})();
</script>
</body>
</html>
