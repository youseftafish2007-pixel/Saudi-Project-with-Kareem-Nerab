<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixelHue — Color by Number</title>
<style>
:root{--bg:#f4f1ea;--surface:#fff;--text:#1d2433;--muted:#6b7280;--accent:#1f7a5c;--line:rgba(0,0,0,.1);--shadow:0 6px 20px rgba(0,0,0,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#1a2133;--text:#eef1f7;--muted:#9aa4b8;--accent:#3ec59a;--line:rgba(255,255,255,.12);--shadow:0 6px 20px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#1a2133;--text:#eef1f7;--muted:#9aa4b8;--accent:#3ec59a;--line:rgba(255,255,255,.12);--shadow:0 6px 20px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* home */
#home{flex:1;overflow-y:auto;padding:16px 14px 28px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:22px;background:linear-gradient(135deg,#1f7a5c,#2a6fdb);color:#fff;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:27px;letter-spacing:-.02em}.hero p{margin:2px 0 0;opacity:.85;font-size:13px}
.ring{--p:0;width:70px;height:70px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.28) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#25619f}
.ring b{position:relative;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.st{background:var(--surface);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.st b{display:block;font-size:16px}.st span{font-size:10.5px;color:var(--muted)}
.cont{display:flex;gap:12px;align-items:center;width:100%;border:0;background:var(--surface);border-radius:16px;padding:10px;text-align:left;box-shadow:var(--shadow);margin-bottom:14px}
.cont canvas{width:56px;height:56px;border-radius:10px;image-rendering:pixelated}
.cont div{flex:1}.cont small{display:block;color:var(--muted)}
.go{background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.tabs{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs small{display:block;font-weight:400;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{border:0;background:var(--surface);border-radius:16px;overflow:hidden;text-align:left;box-shadow:var(--shadow);padding:0}
.lc canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
.meta{padding:10px 11px 11px}.meta b{display:block}.meta span{font-size:12px;color:var(--muted)}
.mbar{height:5px;border-radius:5px;background:var(--line);margin:8px 0 5px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--accent)}
.stars{color:#e6a700;letter-spacing:2px;font-size:14px}
.link{display:block;margin:22px auto 0;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
/* game */
#game{flex:1;min-height:0;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;gap:10px}
.back{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.ttl{flex:1;min-width:0}.ttl b{font-size:17px;display:block}.ttl span{color:var(--muted);font-size:12px}
.pct{text-align:right}.pct b{font-size:24px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.pct span{font-size:12px;color:var(--muted)}.pct em{color:#e5484d;font-style:normal}
#bar{height:6px;margin:0 16px 10px;border-radius:6px;background:var(--line);overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:7px}
.tools button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);font-size:17px;box-shadow:var(--shadow)}
.tools button.on{background:var(--accent);color:#fff}
#pal{display:flex;gap:10px;overflow-x:auto;padding:14px 14px 12px;scrollbar-width:none}
#pal::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:48px;border:0;background:none;padding:0;color:var(--muted);font-size:11px;text-align:center}
.chip{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;font-weight:700;font-size:18px;border:2px solid var(--line);transition:transform .12s}
.sw.sel .chip{transform:translateY(-4px) scale(1.06);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.sw small{display:block;margin-top:5px}.sw.fin{opacity:.45}
#done{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,14,25,.7);z-index:5;padding:20px}
#done.show{display:grid}
.card{background:var(--surface);border-radius:24px;padding:22px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow);animation:pop .4s}
.card h2{margin:4px 0 0;font-size:22px}.card p{margin:0;color:var(--muted);font-size:13px}
#stars{font-size:30px;color:#e6a700;letter-spacing:4px;margin:4px 0}
#thumb{display:block;width:150px;height:150px;image-rendering:pixelated;border-radius:10px;margin:12px auto;box-shadow:var(--shadow)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:12px 6px;border-radius:12px;border:0;font-weight:600;font-size:14px}
.p{background:var(--accent);color:#fff}.g{background:var(--line)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.conf{position:fixed;top:-14px;width:8px;height:12px;animation:fall linear forwards;z-index:6;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">
  <section id="home">
    <div class="hero"><div><h1>PixelHue</h1><p>Color by number · 9 levels</p></div><div class="ring" id="ring"><b id="rp">0%</b></div></div>
    <div class="stats" id="stats"></div>
    <div id="cont"></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <button class="link" id="resetAll">Reset all progress</button>
  </section>
  <section id="game" hidden>
    <header>
      <button class="back" id="bBack" title="Menu">←</button>
      <div class="ttl"><b id="gname"></b><span id="gdiff"></span></div>
      <div class="pct"><b id="pct">0%</b><span id="cnt"></span></div>
    </header>
    <div id="bar"><i id="fill"></i></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="tools">
        <button id="bPan" title="Pan mode">✋</button><button id="bFit" title="Fit">⤢</button>
        <button id="bUndo" title="Undo">↶</button><button id="bHint" title="Hint">💡</button>
        <button id="bPeek" title="Peek at the finished art">👁</button><button id="bReset" title="Restart level">↺</button>
      </div>
    </div>
    <div id="pal"></div>
  </section>
</div>
<div id="done"><div class="card">
  <div style="font-size:36px">🎉</div><h2>Level complete!</h2><div id="stars"></div>
  <canvas id="thumb"></canvas><p id="dstat"></p>
  <div class="btns"><button class="g" id="bMenu">Menu</button><button class="g" id="bView">View</button><button class="p" id="bNext">Next ▸</button></div>
</div></div>
<script>
(()=>{
const $=q=>document.querySelector(q);
const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const lum=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000};

/* ================= LEVEL ART (procedural) ================= */
function build(S,fn){
  const g=new Uint8Array(S*S),rd=Math.round;
  const px=(x,y,c)=>{x=rd(x);y=rd(y);if(x>=0&&x<S&&y>=0&&y<S)g[y*S+x]=c};
  const get=(x,y)=>g[y*S+x];
  const R=(a,b,c,d,k)=>{for(let y=rd(b);y<=rd(d);y++)for(let x=rd(a);x<=rd(c);x++)px(x,y,k)};
  const C=(cx,cy,r,k)=>{for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(Math.hypot(x-cx,y-cy)<=r)g[y*S+x]=k};
  const sky=st=>{const r=[];st.forEach(([c,n])=>{while(n--)r.push(c)});r.forEach((c,y)=>{for(let x=0;x<S;x++){const n=r[y+1];g[y*S+x]=n&&n!==c&&(x+y)%2?n:c}})};
  const each=f=>{for(let y=0;y<S;y++)for(let x=0;x<S;x++)f(x,y)};
  fn({S,px,get,R,C,sky,each,hs});
  for(let i=0;i<g.length;i++)if(!g[i])g[i]=1;
  return g;
}
const D=[
['sunset','Sunset Sea','Easy',20,'3b2667 8e3b8f e8587a ff9e5e ffe08a 1f4e79 2f7fa6',({px,R,C,sky,each,get})=>{
  sky([[1,4],[2,3],[3,2],[4,3]]);C(10,12,5,5);R(0,12,19,19,6);
  for(let y=13;y<20;y+=2){const w=4-((y-13)>>1);R(10-w,y,10+w,y,y<16?5:4)}
  each((x,y)=>{if(y>12&&(x*3+y*5)%7==0&&get(x,y)===6)px(x,y,7)});
  [[3,5],[4,6],[5,5],[14,6],[15,7],[16,6]].forEach(([x,y])=>px(x,y,1));
}],
['oasis','Palm Oasis','Easy',20,'14213d 2c4a7c ffe9a0 e0a458 b5763a 2e7d4f 5a3a22',({px,R,C,sky,each})=>{
  sky([[1,7],[2,13]]);each((x,y)=>{if(y<10&&hs(x,y)>.93)px(x,y,3)});C(14,4,3,3);
  for(let x=0;x<20;x++){R(x,13+Math.round(1.8*Math.sin(x*.45)),x,19,4);R(x,16+Math.round(1.5*Math.sin(x*.5+2)),x,19,5)}
  [[5,15],[5,14],[5,13],[6,12],[6,11],[6,10],[7,9]].forEach(([x,y])=>px(x,y,7));
  [[-1,0],[-2,0],[-3,1],[-4,2],[-5,3],[1,0],[2,0],[3,1],[4,2],[-1,-1],[-2,-2],[1,-1],[2,-2],[0,-1]].forEach(([a,b])=>px(7+a,8+b,6));
}],
['balloon','Sky Balloon','Easy',20,'7ed6ff d6f3ff ff5d73 ffd166 ffffff 8d5a2b 3bb273',({px,R,sky,each})=>{
  sky([[1,12],[2,8]]);R(1,3,5,4,2);R(2,2,4,2,2);R(14,6,18,7,2);R(15,5,17,5,2);
  const st=x=>[4,3,5,3,4,3][Math.abs(x-10)>>1];
  each((x,y)=>{if(Math.hypot(x-10,y-6)<=5.5)px(x,y,st(x))});
  for(let x=7;x<=12;x++)px(x,12,st(x));for(let x=8;x<=11;x++)px(x,13,st(x));
  px(8,14,6);px(11,14,6);R(8,15,11,16,6);
  for(let x=0;x<20;x++)R(x,17+Math.round(1.3*Math.sin(x*.5)),x,19,7);
}],
['lake','Mountain Lake','Medium',28,'7ec8e3 cdeefa ffffff 5b6c8f 3c4a6b 2e6b4a 1e4533 3a8fb7 2a6a8c',({px,R,sky,each})=>{
  sky([[1,9],[2,9]]);R(3,4,9,5,3);R(5,3,7,3,3);R(18,8,24,9,3);R(19,7,22,7,3);
  const M=(cx,pk,sl,c,c2,sn)=>{for(let y=pk;y<=18;y++){const hw=(y-pk)*sl;for(let x=Math.ceil(cx-hw);x<=Math.floor(cx+hw);x++)px(x,y,y-pk<sn?3:x>cx?c2:c)}};
  M(21,9,1,4,4,2);M(8,6,.95,4,5,3);R(0,18,27,19,7);
  const pine=(x,t,n)=>{for(let i=0;i<n;i++){const w=(i*.55)|0;R(x-w,t+i,x+w,t+i,6);if(w)px(x+w,t+i,7)}px(x,t+n,7)};
  pine(3,11,7);pine(7,12,6);pine(21,11,7);pine(25,12,6);pine(17,14,4);
  R(0,20,27,27,8);each((x,y)=>{if(y>19&&(y+(x>>1))%3==0)px(x,y,9);if(y>19&&hs(x,y)>.94)px(x,y,3)});
}],
['city','Neon City','Medium',28,'0b1026 1b2a5a 7a4fa3 ffd166 151a33 232a4d ff6b9d 6ee7f9 f7f7ff',({px,R,C,sky,each,get})=>{
  sky([[1,8],[2,7],[3,6]]);each((x,y)=>{if(y<18&&hs(x,y)>.93&&get(x,y)<3)px(x,y,9)});C(22,6,3,4);
  [[0,4,15],[4,5,12],[9,3,16],[12,5,11],[17,4,14],[21,3,13],[24,4,15]].forEach(([x,w,t])=>R(x,t,x+w-1,27,5));
  [[0,6,18],[6,4,21],[10,5,17],[15,4,22],[19,5,19],[24,4,20]].forEach(([x,w,t])=>{R(x,t,x+w-1,27,6);for(let y=t+2;y<26;y+=2)for(let xx=x+1;xx<x+w-1;xx+=2)if(hs(xx,y)>.4)px(xx,y,4)});
  R(0,26,27,27,5);[[1,20,7],[2,20,7],[12,16,8],[13,16,8],[20,21,7],[25,22,8]].forEach(([x,y,c])=>px(x,y,c));
  each((x,y)=>{if(y>=26&&hs(x,y)>.8)px(x,y,hs(y,x)>.5?4:7)});
}],
['mosque','Dawn Mosque','Medium',28,'2b2d6e 8a5cc2 ff8fa3 ffc971 fff1b8 f2eadf cfc3b0 2f7d6b 1b1f3a',({px,R,C,sky,each,get})=>{
  sky([[1,4],[2,5],[3,5],[4,12]]);each((x,y)=>{if(y<10&&hs(x,y)>.92&&get(x,y)<3)px(x,y,5)});C(21,14,2.6,5);
  R(5,18,22,25,6);R(20,18,22,25,7);
  each((x,y)=>{if(y<=18&&Math.hypot(x-14,y-18)<=5.5)px(x,y,8)});
  R(14,10,14,12,5);px(13,9,5);px(15,9,5);
  [[2,3],[24,25]].forEach(([a,b])=>{R(a,11,b,25,6);R(b,11,b,25,7);R(a,9,b,10,8);px(a,8,5);R(a-1,15,b+1,15,7)});
  R(12,21,15,25,9);R(13,20,14,20,9);R(7,21,8,22,8);R(18,21,19,22,8);R(0,26,27,27,9);
}],
['kaaba','Kaaba at Dusk','Hard',40,'0d1130 1f2a6b a0508b f28c6b ffd29a 131316 2b2b33 d9a73a fff7e8 b9b4aa e8d9b8 ffe9a0',({px,R,sky,each,get})=>{
  sky([[1,9],[2,8],[3,7],[4,5],[5,5]]);
  each((x,y)=>{if(y<14&&hs(x,y)>.93&&get(x,y)<3)px(x,y,12);if(Math.hypot(x-28,y-7)<=4.2&&Math.hypot(x-29.8,y-6)>3.5)px(x,y,12)});
  [3,36].forEach(c=>{R(c-1,10,c+1,33,11);R(c+1,10,c+1,33,10);R(c-1,8,c+1,9,8);R(c,5,c,7,8);R(c-2,15,c+2,15,10);R(c-2,23,c+2,23,10);[12,18,27].forEach(y=>px(c,y,7))});
  R(10,13,30,14,10);R(9,15,23,32,6);R(24,15,30,32,7);R(9,19,23,22,8);R(24,20,30,23,8);
  for(let x=10;x<=22;x+=2){px(x,20,6);px(x+1,21,6)}
  for(let x=25;x<=29;x+=2){px(x,21,7);px(x+1,22,7)}
  [11,13,20,22].forEach(x=>{R(x,15,x,18,7);R(x,24,x,32,7)});[26,28].forEach(x=>{R(x,16,x,19,6);R(x,24,x,32,6)});
  R(14,25,18,32,8);R(15,26,17,31,6);px(16,28,12);
  R(7,33,32,33,10);R(0,34,39,39,9);
  each((x,y)=>{const v=((x-20)/19.5)**2+((y-33)/6)**2;if(y>33&&v>.4&&v<=.85)px(x,y,11)});
  for(let i=0;i<=12;i++){const t=Math.PI*(.1+.8*i/12),x=Math.round(20+15.4*Math.cos(t)),y=Math.round(33+4.7*Math.sin(t));if(y>=34&&y<39&&get(x,y)===11){px(x,y,7);px(x,y+1,9)}}
}],
['planet','Ringed Giant','Hard',40,'05061a 0e1240 ffffff f4a261 e76f51 8c3b2e f6e7c1 b08968 9aa5b1 5c677d 3a2a6e',({px,each})=>{
  each((x,y)=>{let c=1;if(y>32||(y>28&&(x+y)%2))c=2;if(Math.abs(x-y*.6-10)<5&&(x+y)%2==0)c=11;if(hs(x,y)>.95)c=3;px(x,y,c)});
  [[6,6],[33,8],[8,30],[35,24]].forEach(([x,y])=>{px(x,y,3);px(x-1,y,9);px(x+1,y,9);px(x,y-1,9);px(x,y+1,9)});
  each((x,y)=>{
    const u=x-20,v=y-19,vp=v-u*.25,e=(u/17)**2+(vp/4.5)**2,inP=Math.hypot(u,v)<=11;let c=0;
    if(inP){const b=((Math.floor((y+2.2*Math.sin(x*.35))/3)%3)+3)%3;c=[4,5,4][b];const sh=(u+v)*.7/11;if(sh>.5||(sh>.3&&(x+y)%2))c=6}
    if(e>.55&&e<=1&&(vp>0||!inP))c=e>.85?8:7;
    if(c)px(x,y,c);
  });
  each((x,y)=>{if(Math.hypot(x-32,y-31)<=3)px(x,y,(x-32)+(y-31)>2?10:9)});
}],
['aurora','Northern Lights','Hard',40,'070b24 0d1b3e 1fbf9f 7bf1a8 a56bff ffffff 1b2a49 0f1830 eaf6ff 0b1a2d 1a5b6a',({px,R,sky,each,get})=>{
  sky([[1,9],[2,21]]);each((x,y)=>{if(y<24&&hs(x,y)>.94)px(x,y,6)});
  for(let x=0;x<40;x++){const yc=10+5*Math.sin(x*.2)+3*Math.sin(x*.07+1);
    for(let y=Math.round(yc-6);y<=Math.round(yc+7);y++){const t=(y-(yc-6))/13,c=t<.18?5:t<.5?4:t<.85?3:((x+y)%2?3:0);if(c)px(x,y,c)}}
  const ridge=(f,c,sn)=>{for(let x=0;x<40;x++){const t=Math.round(f(x));R(x,t,x,29,c);if(sn&&t<=19)R(x,t,x,t+1,9)}};
  ridge(x=>21+4*Math.sin(x*.25+1)+2*Math.sin(x*.6),7,1);ridge(x=>26+5*Math.sin(x*.17+3)+2*Math.sin(x*.5),8,0);
  [2,6,33,37,35].forEach((x,i)=>{for(let k=0;k<5;k++){const w=(k*.5)|0;R(x-w,25+(i%2)+k,x+w,25+(i%2)+k,8)}});
  each((x,y)=>{if(y>29)px(x,y,10)});
  for(let y=30;y<40;y++)for(let x=0;x<40;x++){if(y%3==0)continue;
    const c=get(x,Math.max(0,Math.round(29-(y-30)*2.2)));
    px(x,y,[3,4,5,9].includes(c)?((x+y)%2?11:10):[7,8].includes(c)?8:10)}
}]
];
const LV=D.map(([id,name,diff,S,pal,fn])=>({id,name,diff,S,COL:[0,...pal.split(' ').map(c=>'#'+c)],T:build(S,fn)}));

/* ================= storage ================= */
const KEY='pixelhue-v1';
let DB={lv:{},last:null};
try{DB=JSON.parse(localStorage.getItem(KEY))||DB}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const rec=id=>DB.lv[id]||(DB.lv[id]={p:'',m:0,t:0,s:0});
const cnt=l=>{const p=rec(l.id).p;let c=0;for(let i=0;i<p.length;i++)if(parseInt(p[i],36)===l.T[i])c++;return c};
const fmt=t=>t<3600?`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`:`${Math.floor(t/3600)}h ${Math.floor(t%3600/60)}m`;
const ghost=h=>{const g=Math.round(238-(255-lum(h))*.42);return`rgb(${g},${g},${g})`};
function thumb(cv,l,full){
  const c=cv.getContext('2d'),r=rec(l.id),S=l.S;cv.width=cv.height=S;
  for(let i=0;i<S*S;i++){const ok=full||parseInt(r.p[i]||'0',36)===l.T[i];c.fillStyle=ok?l.COL[l.T[i]]:ghost(l.COL[l.T[i]]);c.fillRect(i%S,(i/S)|0,1,1)}
}

/* ================= dashboard ================= */
let tab='Easy';
function renderHome(){
  let tot=0,cor=0,mis=0,tm=0,done=0;
  LV.forEach(l=>{const r=rec(l.id);tot+=l.S*l.S;cor+=cnt(l);mis+=r.m;tm+=r.t;if(r.s)done++});
  const pc=Math.floor(cor*100/tot);$('#rp').textContent=pc+'%';$('#ring').style.setProperty('--p',pc);
  $('#stats').innerHTML=[[`${done}/${LV.length}`,'Levels'],[cor.toLocaleString(),'Pixels'],[cor?Math.round(cor*100/(cor+mis))+'%':'—','Accuracy'],[fmt(tm),'Time']].map(([a,b])=>`<div class="st"><b>${a}</b><span>${b}</span></div>`).join('');
  const last=LV.find(l=>l.id===DB.last)||LV.find(l=>!rec(l.id).s)||LV[0],lp=Math.floor(cnt(last)*100/last.S**2);
  $('#cont').innerHTML=`<button class="cont" data-id="${last.id}"><canvas></canvas><div><b>${lp?'Continue':'Start'}: ${last.name}</b><small>${last.diff} · ${lp}% done</small></div><span class="go">${lp?'Play':'Go'}</span></button>`;
  thumb($('#cont canvas'),last);
  $('#tabs').innerHTML=['Easy','Medium','Hard'].map(d=>{const a=LV.filter(l=>l.diff===d);return`<button class="${d===tab?'on':''}" data-t="${d}">${d}<small>${a.filter(l=>rec(l.id).s).length}/${a.length} done</small></button>`}).join('');
  $('#grid').innerHTML=LV.filter(l=>l.diff===tab).map(l=>{const p=Math.floor(cnt(l)*100/l.S**2),s=rec(l.id).s;
    return`<button class="lc" data-id="${l.id}"><canvas></canvas><div class="meta"><b>${l.name}</b><span>${l.S}×${l.S} · ${l.COL.length-1} colors</span><div class="mbar"><i style="width:${p}%"></i></div><span class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></div></button>`}).join('');
  document.querySelectorAll('.lc').forEach(b=>thumb(b.querySelector('canvas'),LV.find(l=>l.id===b.dataset.id)));
}
$('#home').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;renderHome();return}
  const b=e.target.closest('[data-id]');if(b)openLevel(b.dataset.id);
});
let armAll=false;
$('#resetAll').onclick=e=>{const b=e.currentTarget;if(!armAll){armAll=true;b.textContent='Tap again to erase everything';setTimeout(()=>{armAll=false;b.textContent='Reset all progress'},2500)}else{armAll=false;b.textContent='Reset all progress';DB={lv:{},last:null};save();renderHome()}};

/* ================= game state ================= */
let L,S=0,N=0,P,sel=1,correct=0,wrong=0,remain=[],shown=false,ch=false,stroke=[],stack=[],peek=false,hint=null;
const pal=$('#pal');
function recount(){correct=wrong=0;remain=new Array(L.COL.length).fill(0);for(let i=0;i<N;i++){if(P[i]===L.T[i])correct++;else{remain[L.T[i]]++;if(P[i])wrong++}}}
function saveLevel(){rec(L.id).p=Array.from(P,v=>v.toString(36)).join('');save()}
function buildPal(){
  pal.innerHTML='';
  L.COL.forEach((c,i)=>{if(!i)return;const b=document.createElement('button');b.className='sw';
    b.innerHTML=`<span class="chip" style="background:${c};color:${lum(c)>150?'#222':'#fff'}">${i}</span><small></small>`;
    b.onclick=()=>{sel=i;hud();draw();DB.sel=i};pal.appendChild(b)});
}
function hud(){
  $('#pct').textContent=Math.floor(correct*100/N)+'%';$('#fill').style.width=(correct*100/N)+'%';
  $('#cnt').innerHTML=(wrong?`<em>${wrong} wrong</em> · `:'')+`${correct}/${N}`;
  [...pal.children].forEach((b,k)=>{const c=k+1;b.classList.toggle('sel',c===sel);b.classList.toggle('fin',!remain[c]);b.lastChild.textContent=remain[c]?remain[c]:'✓'});
  if(correct===N&&!shown){shown=true;setTimeout(showDone,500)}
}
function openLevel(id){
  L=LV.find(l=>l.id===id);S=L.S;N=S*S;const r=rec(id);
  P=new Uint8Array(N);for(let i=0;i<Math.min(N,r.p.length);i++)P[i]=parseInt(r.p[i],36)||0;
  DB.last=id;stack=[];stroke=[];peek=false;hint=null;$('#bPeek').classList.remove('on');
  recount();shown=correct===N;sel=Math.max(1,remain.findIndex((v,k)=>k&&v>0));
  $('#home').hidden=true;$('#game').hidden=false;$('#done').classList.remove('show');
  $('#gname').textContent=L.name;$('#gdiff').textContent=`${L.diff} · ${S}×${S}`;
  buildPal();measure();fit();hud();draw();save();
}
function showHome(){if(L)saveLevel();$('#game').hidden=true;$('#home').hidden=false;$('#done').classList.remove('show');renderHome()}

/* ================= canvas / view ================= */
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let vw=0,vh=0,dpr=1,s=10,ox=0,oy=0,minS=4,maxS=64,pan=false,dirty=false;
const PAPER='#e4e6ea',HL='#fff2b8',NUM='#6b7280',RED='#e5484d';
function measure(){const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;vw=r.width;vh=r.height;cv.width=vw*dpr;cv.height=vh*dpr}
function fit(){s=Math.min(vw/S,vh/S)*.96;ox=(vw-S*s)/2;oy=(vh-S*s)/2;minS=s*.8}
function clamp(){const m=40;ox=Math.min(vw-m,Math.max(m-S*s,ox));oy=Math.min(vh-m,Math.max(m-S*s,oy))}
function zoomAt(px,py,ns){ns=Math.max(minS,Math.min(maxS,ns));const wx=(px-ox)/s,wy=(py-oy)/s;s=ns;ox=px-wx*s;oy=py-wy*s;clamp()}
new ResizeObserver(()=>{if(!L||$('#game').hidden)return;measure();draw()}).observe(stage);
function draw(){if(!dirty){dirty=true;requestAnimationFrame(render)}}
function render(){
  dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);if(!L||$('#game').hidden)return;
  const T=L.T,COL=L.COL,all=correct===N||peek;
  ctx.fillStyle=PAPER;ctx.fillRect(ox,oy,S*s,S*s);
  const x0=Math.max(0,Math.floor(-ox/s)),x1=Math.min(S-1,Math.floor((vw-ox)/s)),y0=Math.max(0,Math.floor(-oy/s)),y1=Math.min(S-1,Math.floor((vh-oy)/s));
  const showNum=s>=9;let lf=0;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*S+x,p=P[i],px=ox+x*s,py=oy+y*s;
    if(peek){ctx.fillStyle=COL[T[i]];ctx.fillRect(px,py,s+.5,s+.5)}
    else if(p){
      ctx.fillStyle=COL[p];ctx.fillRect(px,py,s+.5,s+.5);
      if(p!==T[i]){ctx.strokeStyle=RED;ctx.lineWidth=Math.max(1,s*.12);ctx.beginPath();
        ctx.moveTo(px+s*.25,py+s*.25);ctx.lineTo(px+s*.75,py+s*.75);ctx.moveTo(px+s*.75,py+s*.25);ctx.lineTo(px+s*.25,py+s*.75);ctx.stroke()}
    }else{
      if(T[i]===sel){ctx.fillStyle=HL;ctx.fillRect(px,py,s,s)}
      if(showNum){const f=T[i]>9?.4:.5;if(f!==lf){ctx.font=`600 ${s*f}px system-ui,sans-serif`;lf=f}ctx.fillStyle=T[i]===sel?'#3a3326':NUM;ctx.fillText(T[i],px+s/2,py+s/2+.5)}
    }
  }
  if(!all&&s>=6){
    ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;ctx.beginPath();
    for(let x=x0;x<=x1+1;x++){ctx.moveTo(Math.round(ox+x*s)+.5,oy+y0*s);ctx.lineTo(Math.round(ox+x*s)+.5,oy+(y1+1)*s)}
    for(let y=y0;y<=y1+1;y++){ctx.moveTo(ox+x0*s,Math.round(oy+y*s)+.5);ctx.lineTo(ox+(x1+1)*s,Math.round(oy+y*s)+.5)}
    ctx.stroke();
  }
  if(hint){const n=performance.now();if(n<hint.t){const x=hint.i%S,y=(hint.i/S)|0,k=1+.25*Math.sin(n/120);
    ctx.strokeStyle='#ff3d71';ctx.lineWidth=3;ctx.strokeRect(ox+(x+.5)*s-s*k*.75,oy+(y+.5)*s-s*k*.75,s*k*1.5,s*k*1.5);draw()}else hint=null}
}

/* ================= painting + tools ================= */
const cellAt=(cx,cy)=>{const x=Math.floor((cx-ox)/s),y=Math.floor((cy-oy)/s);return x>=0&&y>=0&&x<S&&y<S?y*S+x:-1};
function paint(i){
  if(i<0||peek||P[i]===sel||P[i]===L.T[i])return;
  const o=P[i];if(o&&o!==L.T[i])wrong--;
  stroke.push(i,o);P[i]=sel;
  if(sel===L.T[i]){correct++;remain[sel]--}
  else{wrong++;rec(L.id).m++;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
  ch=true;
}
let lx=0,ly=0;
function strokeTo(x,y){const dx=x-lx,dy=y-ly,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(s*.4)));for(let k=1;k<=n;k++)paint(cellAt(lx+dx*k/n,ly+dy*k/n));lx=x;ly=y}
function flush(){if(ch){ch=false;hud();draw()}}
function endStroke(){if(stroke.length){stack.push(stroke);if(stack.length>60)stack.shift();stroke=[]}saveLevel()}
$('#bUndo').onclick=()=>{const st=stack.pop();if(!st)return;for(let k=st.length-2;k>=0;k-=2)P[st[k]]=st[k+1];recount();saveLevel();hud();draw()};
$('#bHint').onclick=()=>{
  if(correct===N)return;const cx=(vw/2-ox)/s,cy=(vh/2-oy)/s;let b=-1,bd=1e9;
  for(let pass=0;pass<2&&b<0;pass++)for(let i=0;i<N;i++){
    if(P[i]===L.T[i]||(pass===0&&L.T[i]!==sel))continue;
    const d=Math.hypot(i%S+.5-cx,((i/S)|0)+.5-cy);if(d<bd){bd=d;b=i}}
  if(b<0)return;sel=L.T[b];if(s<14)s=14;ox=vw/2-(b%S+.5)*s;oy=vh/2-(((b/S)|0)+.5)*s;clamp();
  hint={i:b,t:performance.now()+2600};hud();draw();
};
$('#bPeek').onclick=e=>{peek=!peek;e.currentTarget.classList.toggle('on',peek);draw()};
$('#bPan').onclick=e=>{pan=!pan;e.currentTarget.classList.toggle('on',pan)};
$('#bFit').onclick=()=>{fit();draw()};
let armed=false;const bR=$('#bReset');
bR.onclick=()=>{
  if(!armed){armed=true;bR.textContent='?';bR.classList.add('on');setTimeout(()=>{armed=false;bR.textContent='↺';bR.classList.remove('on')},2000)}
  else{armed=false;bR.textContent='↺';bR.classList.remove('on');const r=rec(L.id);r.m=0;r.t=0;P.fill(0);stack=[];shown=false;recount();saveLevel();$('#done').classList.remove('show');hud();draw()}
};
$('#bBack').onclick=showHome;$('#bMenu').onclick=showHome;
$('#bView').onclick=()=>$('#done').classList.remove('show');

/* ================= gestures ================= */
const ptr=new Map();let mode=null,pinch=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=pos(e);ptr.set(e.pointerId,p);
  if(ptr.size===2){mode='pinch';const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s,ox,oy}}
  else if(ptr.size===1){lx=p.x;ly=p.y;if(pan||peek)mode='pan';else{mode='paint';paint(cellAt(p.x,p.y));flush()}}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const p=pos(e),prev=ptr.get(e.pointerId);ptr.set(e.pointerId,p);
  if(mode==='pinch'&&ptr.size>=2){
    const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const ns=Math.max(minS,Math.min(maxS,pinch.s*d/pinch.d)),wx=(pinch.mx-pinch.ox)/pinch.s,wy=(pinch.my-pinch.oy)/pinch.s;
    s=ns;ox=mx-wx*s;oy=my-wy*s;clamp();draw();
  }else if(mode==='pan'){ox+=p.x-prev.x;oy+=p.y-prev.y;clamp();draw()}
  else if(mode==='paint'){strokeTo(p.x,p.y);flush()}
});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size===1&&mode==='pinch')mode='none';if(ptr.size===0){if(mode==='paint')endStroke();mode=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,s*Math.exp(-e.deltaY*.0015));draw()},{passive:false});
addEventListener('keydown',e=>{if(L&&!$('#game').hidden&&e.key>='1'&&e.key<='9'&&+e.key<L.COL.length){sel=+e.key;hud();draw()}});

/* ================= completion ================= */
function showDone(){
  const r=rec(L.id),acc=N/(N+r.m),st=acc>=.95?3:acc>=.85?2:1;r.s=Math.max(r.s,st);saveLevel();
  $('#stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('#dstat').textContent=`${Math.round(acc*100)}% accuracy · ${r.m} mistakes · ${fmt(r.t)}`;
  thumb($('#thumb'),L,true);
  const i=LV.indexOf(L),nx=LV[i+1];$('#bNext').hidden=!nx;$('#bNext').onclick=()=>nx&&openLevel(nx.id);
  $('#done').classList.add('show');
  for(let k=0;k<40;k++){const d=document.createElement('i');d.className='conf';
    d.style.cssText=`left:${Math.random()*100}%;background:${L.COL[1+Math.floor(Math.random()*(L.COL.length-1))]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),4800)}
}
setInterval(()=>{if(L&&!$('#game').hidden&&!document.hidden){const r=rec(L.id);r.t++;if(r.t%15==0)save()}},1000);
addEventListener('pagehide',()=>{if(L&&!$('#game').hidden)saveLevel()});
renderHome();
})();
</script>
</body>
</html>
